[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app (ADR-0004: shell bootstrap for
# harnesses; homebrew formula pushed to the tap on each tagged release)
installers = ["shell", "homebrew"]
# The Homebrew tap (ADR-0004 QST-TAP-HOME: personal tap; requires the
# HOMEBREW_TAP_TOKEN secret on this repo before the first tagged release)
tap = "jlumbroso/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
