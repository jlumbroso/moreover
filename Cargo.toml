[package]
name = "moreover"
version = "0.1.0"
edition = "2021"
description = "A pager for readers who can't press space — cursor-based, non-interactive pagination for LLMs, agents, and scripts."
license = "MIT"
repository = "https://github.com/jlumbroso/moreover"
homepage = "https://github.com/jlumbroso/moreover"
readme = "README.md"
keywords = ["pager", "llm", "cli", "pagination", "cursor"]
categories = ["command-line-utilities"]
# The crate ships the tool; the full deliberation record (docs/adr/) lives
# in the repository, which is the project's front door.
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
